name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: ['sixteen']

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [r9q]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free up disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get purge -y azure-cli google-cloud-sdk hhvm google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force
          df -h

      - name: Setup
        run: |
          sudo apt update && sudo apt install -yq 7zip attr ccache clang ffmpeg libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p security
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh
          ./scripts/download_fw.sh
          ./scripts/extract_fw.sh
          ./scripts/make_rom.sh

      - name: Fix permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER out/
          sudo chmod -R 755 out/

      - name: Locate and Identify ROM
        if: always()
        run: |
          echo "Listing all files in out/ to find the ROM..."
          # This prints the size and path of every single file
          find out -type f -exec ls -lh {} + | sort -rh | head -n 20

      - name: Create Release and Upload Asset
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          # Only attempt to upload if a matching file is found
          files: |
            out/target/product/${{ matrix.target }}/*.zip
          tag_name: ${{ github.run_id }}
          name: "Build ${{ github.run_id }}"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
