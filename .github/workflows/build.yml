name: Build

on:
  workflow_dispatch:
  push:
    branches: ['sixteen']

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq, a53x, a73xq, b0q, g0q, m52xq, o1s, p3s, r0q, r9s, t2s, r9q]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Setup
        run: |
          sudo apt update && sudo apt install -yq 7zip attr ccache clang ffmpeg libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p security
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Build ROM
        env:
          TARGET_ODM_PARTITION_SIZE: "209715200"
          # Set to 6.4 GB to fit your 5.3 GB system image
          TARGET_SYSTEM_PARTITION_SIZE: "6871947673"
          TARGET_VENDOR_PARTITION_SIZE: "2147483648"
          TARGET_PRODUCT_PARTITION_SIZE: "2147483648"
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh
          ./scripts/download_fw.sh
          ./scripts/extract_fw.sh
          ./scripts/make_rom.sh
